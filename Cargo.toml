[package]
name = "boar"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
byte-unit = { version = "5.1.6", features = ["serde"] }
cfg-if = "1.0.4"
clap = { version = "4.5.51", features = ["derive"] }
convert_case = "0.10.0"
plotly = "0.13.5"
regex = "1.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = "0.18.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
